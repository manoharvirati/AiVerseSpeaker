name: ai_verse_speaker
description: A voice-first AI English speaking coach prototype.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_tts: ^4.2.5
  google_fonts: ^8.1.0
  http: ^1.2.2
  archive: ^4.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  speech_to_text: ^7.4.0
  sqflite: ^2.4.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/database/


flutter_launcher_icons:
  android: true
  ios: true
  image_path_ios: "public/logo.png"
  image_path_android: "public/logo.png"
  adaptive_icon_background: "#B72A67"
  #  background-color: "#B72A67"
  adaptive_icon_foreground: "public/logo.png"
  remove_alpha_ios: true